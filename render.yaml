services:
  - type: web
    name: applyflow-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 30
    envVars:
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
