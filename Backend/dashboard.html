<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshHire — India BTech Fresher Jobs</title>
  <meta name="description" content="Live job board for BTech freshers in India — SDE, Full Stack, Backend, Frontend, GenAI & YC/HN jobs aggregated from LinkedIn, Naukri, Internshala and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── CSS Reset & Variables ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0b0f;
      --bg2:       #12141a;
      --bg3:       #1a1d26;
      --border:    rgba(255,255,255,0.07);
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --accent:    #6366f1;
      --accent2:   #8b5cf6;
      --green:     #10b981;
      --yellow:    #f59e0b;
      --red:       #ef4444;
      --pink:      #ec4899;
      --cyan:      #06b6d4;
      --radius:    14px;
      --radius-sm: 8px;
      --shadow:    0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,11,15,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .logo {
      font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo span { font-weight: 300; color: var(--muted); -webkit-text-fill-color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 20px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .refresh-btn:hover { background: var(--accent); border-color: var(--accent); }
    .refresh-btn.loading { opacity: 0.6; pointer-events: none; }
    .last-updated { font-size: 0.72rem; color: var(--muted); }

    /* ── Hero / Stats Bar ── */
    .stats-bar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
    }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-value {
      font-size: 1.6rem; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-divider { width: 1px; height: 36px; background: var(--border); }
    .role-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
    .role-pill-stat {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 20px;
      border: 1px solid var(--border); color: var(--muted);
    }

    /* ── Main Layout ── */
    .main { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* ── Search & Filters ── */
    .controls { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.4; }
    #searchInput {
      width: 100%; padding: 13px 16px 13px 44px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s;
    }
    #searchInput:focus { outline: none; border-color: var(--accent); }
    #searchInput::placeholder { color: var(--muted); }

    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; }
    .filter-pill {
      padding: 6px 14px; border-radius: 20px;
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--muted); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .filter-pill:hover { border-color: rgba(99,102,241,0.5); color: var(--text); }
    .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Job Grid ── */
    #jobGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    /* ── Job Card ── */
    .job-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      position: relative; overflow: hidden;
    }
    .job-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      opacity: 0; transition: opacity 0.2s;
    }
    .job-card:hover { border-color: rgba(99,102,241,0.3); transform: translateY(-2px); box-shadow: var(--shadow); }
    .job-card:hover::before { opacity: 1; }

    /* Role-based top border colors */
    .card-role-sde::before    { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
    .card-role-full::before   { background: linear-gradient(90deg, #06b6d4, #3b82f6); }
    .card-role-back::before   { background: linear-gradient(90deg, #10b981, #059669); }
    .card-role-front::before  { background: linear-gradient(90deg, #f59e0b, #f97316); }
    .card-role-genai::before  { background: linear-gradient(90deg, #ec4899, #a855f7); }
    .card-role-yc::before     { background: linear-gradient(90deg, #ff6600, #f59e0b); }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-title  { font-size: 0.95rem; font-weight: 600; line-height: 1.4; color: var(--text); }
    .card-company { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 0.68rem; padding: 3px 8px; border-radius: 20px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge-role-sde    { background: rgba(99,102,241,0.15);  color: #818cf8; border: 1px solid rgba(99,102,241,0.25); }
    .badge-role-full   { background: rgba(6,182,212,0.15);   color: #22d3ee; border: 1px solid rgba(6,182,212,0.25); }
    .badge-role-back   { background: rgba(16,185,129,0.15);  color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .badge-role-front  { background: rgba(245,158,11,0.15);  color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
    .badge-role-genai  { background: rgba(236,72,153,0.15);  color: #f472b6; border: 1px solid rgba(236,72,153,0.25); }
    .badge-role-yc     { background: rgba(255,102,0,0.15);   color: #fb923c; border: 1px solid rgba(255,102,0,0.25); }
    .badge-source      { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }

    .card-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .card-desc {
      font-size: 0.8rem; color: var(--muted); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .posted-date { font-size: 0.72rem; color: var(--muted); }
    .apply-btn {
      padding: 8px 18px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-size: 0.8rem; font-weight: 600;
      text-decoration: none; border: none;
      transition: opacity 0.2s, transform 0.15s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .apply-btn:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ── Empty / Loading States ── */
    .state-container {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px 24px; text-align: center; gap: 16px;
    }
    .state-icon { font-size: 3rem; }
    .state-title { font-size: 1.1rem; font-weight: 600; }
    .state-desc { font-size: 0.85rem; color: var(--muted); max-width: 360px; }

    /* Spinner */
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--bg3);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pulse animation on count */
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    .loading-pulse { animation: pulse 1.5s ease-in-out infinite; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 0 16px; }
      .stats-bar { padding: 16px; gap: 16px; }
      .main { padding: 16px; }
      #jobGrid { grid-template-columns: 1fr; }
      .role-stats { display: none; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">FreshHire <span>India</span></div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="loadJobs()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
</header>

<!-- ── Stats Bar ── -->
<div class="stats-bar">
  <div class="stat">
    <span class="stat-value loading-pulse" id="totalCount">—</span>
    <span class="stat-label">Total Jobs</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <span class="stat-value loading-pulse" id="shownCount">—</span>
    <span class="stat-label">Showing</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <span class="stat-value" id="sourceCount" style="font-size:1.1rem;background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent">6</span>
    <span class="stat-label">Sources</span>
  </div>
  <div class="role-stats" id="roleStats"></div>
</div>

<!-- ── Main ── -->
<main class="main">
  <div class="controls">
    <!-- Search -->
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search by title, company, or keyword…" oninput="applyFilters()" />
    </div>

    <!-- Role filter -->
    <div class="filter-row">
      <span class="filter-label">Role</span>
      <button class="filter-pill active" data-role="" onclick="setRole(this)">All</button>
      <button class="filter-pill" data-role="sde"          onclick="setRole(this)">SDE / SWE</button>
      <button class="filter-pill" data-role="full stack"   onclick="setRole(this)">Full Stack</button>
      <button class="filter-pill" data-role="backend"      onclick="setRole(this)">Backend</button>
      <button class="filter-pill" data-role="frontend"     onclick="setRole(this)">Frontend</button>
      <button class="filter-pill" data-role="genai"        onclick="setRole(this)">GenAI / AI</button>
      <button class="filter-pill" data-role="yc"           onclick="setRole(this)">YC / HN</button>
    </div>

    <!-- Source filter -->
    <div class="filter-row">
      <span class="filter-label">Source</span>
      <button class="filter-pill active" data-source="" onclick="setSource(this)">All</button>
      <button class="filter-pill" data-source="linkedin"    onclick="setSource(this)">LinkedIn</button>
      <button class="filter-pill" data-source="indeed"      onclick="setSource(this)">Indeed</button>
      <button class="filter-pill" data-source="naukri"      onclick="setSource(this)">Naukri</button>
      <button class="filter-pill" data-source="internshala" onclick="setSource(this)">Internshala</button>
      <button class="filter-pill" data-source="glassdoor"   onclick="setSource(this)">Glassdoor</button>
      <button class="filter-pill" data-source="google"      onclick="setSource(this)">Google</button>
      <button class="filter-pill" data-source="hn"          onclick="setSource(this)">HN / YC</button>
    </div>
  </div>

  <!-- Job Grid -->
  <div id="jobGrid">
    <div class="state-container">
      <div class="spinner"></div>
      <div class="state-title">Loading jobs…</div>
      <div class="state-desc">Fetching from Google Sheet</div>
    </div>
  </div>
</main>

<script>
  const API_BASE = 'http://localhost:5050';
  let allJobs = [];
  let activeRole   = '';
  let activeSource = '';

  // ── Role → CSS class map ──
  function roleClass(role) {
    const r = (role || '').toLowerCase();
    if (r.includes('sde') || r.includes('swe') || r.includes('software')) return 'sde';
    if (r.includes('full'))    return 'full';
    if (r.includes('back'))    return 'back';
    if (r.includes('front'))   return 'front';
    if (r.includes('gen') || r.includes('ai')) return 'genai';
    if (r.includes('yc') || r.includes('hn')) return 'yc';
    return 'sde';
  }

  function roleBadgeLabel(role) {
    const r = (role || '').toLowerCase();
    if (r.includes('sde') || r.includes('swe')) return 'SDE/SWE';
    if (r.includes('full'))  return 'Full Stack';
    if (r.includes('back'))  return 'Backend';
    if (r.includes('front')) return 'Frontend';
    if (r.includes('gen') || r.includes('ai')) return 'GenAI';
    if (r.includes('yc') || r.includes('hn'))  return 'YC/HN';
    return role || '—';
  }

  // ── Escape HTML ──
  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Format date ──
  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str);
      const now = new Date();
      const diff = Math.floor((now - d) / 3600000);
      if (diff < 1)  return 'just now';
      if (diff < 24) return `${diff}h ago`;
      const days = Math.floor(diff / 24);
      if (days === 1) return '1 day ago';
      return `${days} days ago`;
    } catch { return str.slice(0,10); }
  }

  // ── Build card HTML ──
  function buildCard(job) {
    const rc  = roleClass(job.role_category);
    const url = esc(job.job_url || '');
    const title = esc(job.title || '(No title — see post)');
    const company = esc(job.company || job.by || '');
    const location = esc(job.location || '');
    const source = esc(job.source || '');
    const desc = esc(job.description_snippet || '');
    const posted = fmtDate(job.posted_at || job.scraped_at);
    const roleLabel = roleBadgeLabel(job.role_category);

    return `
    <div class="job-card card-role-${rc}">
      <div class="card-header">
        <div>
          <div class="card-title">${title}</div>
          ${company ? `<div class="card-company">🏢 ${company}</div>` : ''}
        </div>
      </div>
      <div class="badges">
        <span class="badge badge-role-${rc}">${roleLabel}</span>
        ${source ? `<span class="badge badge-source">${source}</span>` : ''}
      </div>
      ${location ? `<div class="card-meta"><span class="meta-item">📍 ${location}</span></div>` : ''}
      ${desc ? `<div class="card-desc">${desc}</div>` : ''}
      <div class="card-footer">
        <span class="posted-date">${posted}</span>
        ${url ? `<a class="apply-btn" href="${url}" target="_blank" rel="noopener">Apply ↗</a>` : ''}
      </div>
    </div>`;
  }

  // ── Render jobs ──
  function render(jobs) {
    const grid = document.getElementById('jobGrid');
    document.getElementById('shownCount').textContent = jobs.length.toLocaleString();
    document.getElementById('shownCount').classList.remove('loading-pulse');

    if (!jobs.length) {
      grid.innerHTML = `
        <div class="state-container">
          <div class="state-icon">🔍</div>
          <div class="state-title">No jobs found</div>
          <div class="state-desc">Try adjusting filters or run /scrape-everything on the server to fetch fresh jobs.</div>
        </div>`;
      return;
    }
    grid.innerHTML = jobs.map(buildCard).join('');
  }

  // ── Apply all active filters ──
  function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    let filtered = allJobs;

    if (activeRole) {
      filtered = filtered.filter(j =>
        (j.role_category || '').toLowerCase().includes(activeRole)
      );
    }
    if (activeSource) {
      filtered = filtered.filter(j =>
        (j.source || '').toLowerCase().includes(activeSource)
      );
    }
    if (q) {
      filtered = filtered.filter(j =>
        (j.title || '').toLowerCase().includes(q) ||
        (j.company || '').toLowerCase().includes(q) ||
        (j.description_snippet || '').toLowerCase().includes(q) ||
        (j.location || '').toLowerCase().includes(q)
      );
    }
    render(filtered);
  }

  function setRole(btn) {
    document.querySelectorAll('[data-role]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeRole = btn.dataset.role;
    applyFilters();
  }

  function setSource(btn) {
    document.querySelectorAll('[data-source]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSource = btn.dataset.source;
    applyFilters();
  }

  // ── Update role stats ──
  function updateRoleStats(jobs) {
    const counts = {};
    jobs.forEach(j => {
      const lbl = roleBadgeLabel(j.role_category);
      counts[lbl] = (counts[lbl] || 0) + 1;
    });
    const el = document.getElementById('roleStats');
    el.innerHTML = Object.entries(counts)
      .sort((a,b) => b[1]-a[1])
      .map(([k,v]) => `<span class="role-pill-stat">${k} <strong>${v}</strong></span>`)
      .join('');
  }

  // ── Load from API ──
  async function loadJobs() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    btn.textContent = 'Loading…';

    document.getElementById('totalCount').classList.add('loading-pulse');
    document.getElementById('shownCount').classList.add('loading-pulse');

    try {
      const res = await fetch(`${API_BASE}/jobs`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      allJobs = data.jobs || [];
      document.getElementById('totalCount').textContent = allJobs.length.toLocaleString();
      document.getElementById('totalCount').classList.remove('loading-pulse');
      document.getElementById('lastUpdated').textContent = 'Updated ' + fmtDate(new Date().toISOString());

      updateRoleStats(allJobs);
      applyFilters();

    } catch (err) {
      document.getElementById('jobGrid').innerHTML = `
        <div class="state-container">
          <div class="state-icon">⚠️</div>
          <div class="state-title">Could not connect to server</div>
          <div class="state-desc">Make sure <code>server.py</code> is running on <strong>localhost:5050</strong>.<br/><br/>Error: ${esc(err.message)}</div>
        </div>`;
      document.getElementById('totalCount').textContent = '—';
      document.getElementById('shownCount').textContent = '—';
    } finally {
      btn.classList.remove('loading');
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Refresh`;
    }
  }

  // ── Auto-refresh every 30 min ──
  setInterval(loadJobs, 30 * 60 * 1000);

  // ── Initial load ──
  loadJobs();
</script>
</body>
</html>
